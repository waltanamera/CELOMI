<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A0F45">
<title>CELOMI Motors · Catálogo Digital 2026</title>
<style>
:root{
  --morado:#5B2294; --morado-osc:#3A1560; --morado-deep:#240C3D;
  --verde:#1E8A2D; --verde-cl:#28A83A;
  --tinta:#141218; --gris:#6B6875; --linea:#E4E1EA; --fondo:#F4F2F7; --blanco:#fff;
  --r:16px; --sombra:0 2px 4px rgba(20,18,24,.06),0 12px 28px rgba(20,18,24,.08);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  background:var(--fondo); color:var(--tinta); overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
img{display:block;max-width:100%}

/* ---------- PORTADA ---------- */
#cover{
  position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:32px 24px;
  background:radial-gradient(120% 80% at 50% 0%,#4A1B7A 0%,#2A0F45 55%,#160823 100%);
  transition:opacity .5s ease,visibility .5s;
}
#cover.off{opacity:0;visibility:hidden;pointer-events:none}
#cover .bars{display:flex;gap:6px;margin-bottom:26px}
#cover .bars i{width:34px;height:5px;border-radius:3px;display:block}
#cover img{width:min(320px,72vw);margin-bottom:22px}
#cover h1{
  font-size:clamp(26px,7vw,44px);line-height:1.06;margin:0 0 6px;color:#fff;
  font-weight:800;letter-spacing:.02em;
}
#cover h1 em{font-style:normal;color:#B98AE8;display:block;font-size:.62em;letter-spacing:.34em;margin-bottom:8px}
#cover p.tag{color:#CFC3E0;font-size:clamp(13px,3.6vw,16px);margin:14px 0 0;max-width:420px;line-height:1.5}
#cover .cta{
  margin-top:34px;background:linear-gradient(135deg,var(--verde-cl),var(--verde));
  color:#fff;font-weight:700;font-size:17px;padding:16px 40px;border-radius:100px;
  box-shadow:0 10px 26px rgba(30,138,45,.42);letter-spacing:.02em;
}
#cover .cta:active{transform:scale(.97)}
#cover .meta{position:absolute;bottom:calc(20px + var(--safe-b));color:#7E6C93;font-size:11.5px;line-height:1.7}
#cover .meta b{color:#A995C0;font-weight:600}

/* ---------- HEADER ---------- */
header{
  position:sticky;top:0;z-index:40;background:var(--morado-deep);
  padding:10px 14px 0;box-shadow:0 2px 14px rgba(0,0,0,.18);
}
.hrow{display:flex;align-items:center;gap:10px}
.hrow img{height:26px;width:auto;cursor:pointer}
.hrow .sp{flex:1}
.icobtn{
  width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;position:relative;
}
.icobtn .badge{
  position:absolute;top:-4px;right:-4px;background:var(--verde-cl);color:#fff;
  font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}
.searchwrap{padding:10px 0 12px;display:none}
.searchwrap.on{display:block}
.searchwrap input{
  width:100%;border:0;border-radius:12px;padding:12px 14px;font-size:15px;
  background:rgba(255,255,255,.13);color:#fff;outline:2px solid transparent;
}
.searchwrap input::placeholder{color:#A08FB8}
.searchwrap input:focus{outline-color:var(--verde-cl);background:rgba(255,255,255,.18)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 0 11px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:8px 15px;border-radius:100px;font-size:13px;font-weight:600;
  background:rgba(255,255,255,.09);color:#C8B8DC;white-space:nowrap;border:1px solid transparent;
}
.chip.on{background:#fff;color:var(--morado-deep);font-weight:700}
.chips.cat .chip.on{background:var(--verde);color:#fff}

/* ---------- BARRA RESULTADOS ---------- */
.bar{
  display:flex;align-items:center;gap:10px;padding:12px 16px 4px;
  font-size:12.5px;color:var(--gris);
}
.bar b{color:var(--tinta);font-weight:700}
.bar select{
  margin-left:auto;border:1px solid var(--linea);background:#fff;border-radius:9px;
  padding:7px 9px;font-size:12.5px;color:var(--tinta);font-family:inherit;
}

/* ---------- GRID ---------- */
main{padding:8px 12px calc(96px + var(--safe-b))}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}main{padding:10px 20px 120px}}
@media(min-width:920px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1280px){.grid{grid-template-columns:repeat(5,1fr)}main{max-width:1500px;margin:0 auto}}
.card{
  background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra);
  display:flex;flex-direction:column;position:relative;transition:transform .16s;
}
.card:active{transform:scale(.985)}
.card .ph{background:#fff;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;padding:6px}
.card .ph img{max-height:100%;object-fit:contain}
.card .body{padding:9px 11px 12px;display:flex;flex-direction:column;flex:1}
.card .mk{font-size:9.5px;font-weight:800;letter-spacing:.11em;color:var(--morado);text-transform:uppercase}
.card h3{font-size:14.5px;margin:2px 0 5px;line-height:1.22;font-weight:700}
.card .cat{font-size:11px;color:var(--gris);margin-bottom:8px}
.card .pr{margin-top:auto;font-size:16px;font-weight:800;color:var(--tinta);letter-spacing:-.01em}
.card .pr small{font-size:10px;font-weight:600;color:var(--gris);margin-left:3px}
.card .pr.ask{font-size:12.5px;color:var(--morado);font-weight:700}
.cmpbtn{
  position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:9px;
  background:rgba(255,255,255,.94);box-shadow:0 1px 5px rgba(0,0,0,.16);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--gris);
}
.cmpbtn.on{background:var(--verde);color:#fff}
.empty{text-align:center;color:var(--gris);padding:60px 20px;font-size:14px}
.card.pend{box-shadow:none;background:#FBFAFD;border:1.5px dashed #C9C2D6}
.card.pend .ph{background:transparent;color:#B7AEC7}
.card.pend .ph svg{width:52%;max-width:110px;opacity:.85}
.tagpend{
  display:inline-block;background:#FFF1CF;color:#8A6212;font-size:9.5px;font-weight:800;
  letter-spacing:.06em;padding:3px 7px;border-radius:6px;margin-bottom:5px;text-transform:uppercase;
}
.pendbox{
  background:#fff;border-radius:var(--r);box-shadow:var(--sombra);padding:20px;margin-top:14px;
  text-align:center;color:var(--gris);font-size:13.5px;line-height:1.6;
}
.pendbox svg{width:74px;opacity:.5;margin:0 auto 12px}
.pendbox b{display:block;color:var(--tinta);font-size:15px;margin-bottom:5px}

/* ---------- DETALLE ---------- */
#detail{
  position:fixed;inset:0;z-index:60;background:var(--fondo);overflow-y:auto;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.3,.8,.4,1);
  -webkit-overflow-scrolling:touch;
}
#detail.on{transform:none}
.dtop{position:sticky;top:0;z-index:5;background:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--linea)}
.dtop .back{width:36px;height:36px;border-radius:10px;background:var(--fondo);display:flex;align-items:center;justify-content:center;font-size:18px}
.dtop .t{font-weight:700;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero{background:#fff;padding:14px 16px 20px;text-align:center}
.hero img{margin:0 auto;max-height:270px;object-fit:contain}
.dwrap{padding:0 16px}
@media(min-width:900px){
  .dgrid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.05fr .95fr;gap:26px;align-items:start;padding:20px}
  .hero{border-radius:var(--r);padding:26px}
  .hero img{max-height:420px}
  .dwrap{padding:0}
}
.dmk{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--morado);text-transform:uppercase;margin-top:16px}
.dwrap h2{font-size:26px;margin:4px 0 4px;line-height:1.14;font-weight:800;letter-spacing:-.01em}
.dcat{font-size:13px;color:var(--gris)}
.dprice{
  margin:14px 0 0;background:linear-gradient(135deg,var(--morado),var(--morado-osc));color:#fff;
  border-radius:var(--r);padding:15px 18px;display:flex;align-items:center;gap:12px;
}
.dprice{flex-wrap:wrap}
.dprice .n{font-size:clamp(21px,6.2vw,28px);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.dprice .n u{text-decoration:none;font-size:.5em;font-weight:700;color:#C6AEE4;margin-left:5px;letter-spacing:.06em}
.dprice .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#C6AEE4;font-weight:700}
.dprice .msi{margin-left:auto;text-align:right;font-size:11px;color:#D9C9EC;line-height:1.4;flex:0 1 auto}
@media(max-width:430px){.dprice .msi{margin-left:0;text-align:left;flex-basis:100%;border-top:1px solid rgba(255,255,255,.16);padding-top:9px}}
.dprice.ask .n{font-size:18px}
.hl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 0}
@media(max-width:400px){.hl{grid-template-columns:repeat(2,1fr)}}
.hl div{background:#fff;border-radius:12px;padding:11px 8px;text-align:center;box-shadow:var(--sombra)}
.hl b{display:block;font-size:15px;font-weight:800;line-height:1.15}
.hl span{display:block;font-size:9.5px;color:var(--gris);margin-top:3px;letter-spacing:.03em}
.sec{margin:22px 0 0;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--gris)}
.cols{display:flex;gap:9px;margin-top:9px;flex-wrap:wrap}
.cols i{width:30px;height:30px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.1)}
table.sp{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra);margin-top:9px}
table.sp td{padding:11px 13px;font-size:13px;border-bottom:1px solid var(--linea);vertical-align:top}
table.sp tr:last-child td{border-bottom:0}
table.sp td:first-child{color:var(--gris);width:44%;font-weight:600}
table.sp td:last-child{font-weight:600}
.nota{
  margin-top:12px;background:#FFF6E0;border-radius:12px;padding:11px 13px;
  font-size:12px;color:#7A5A12;line-height:1.5;
}
.dacts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0 34px}
.btn{padding:14px;border-radius:13px;font-weight:700;font-size:14px;text-align:center;display:block;text-decoration:none}
.btn.pri{background:var(--verde);color:#fff;grid-column:1/-1;box-shadow:0 6px 16px rgba(30,138,45,.3)}
.btn.sec{background:#fff;color:var(--tinta);box-shadow:var(--sombra)}

/* ---------- COMPARADOR ---------- */
#cmpbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--morado-deep);color:#fff;
  padding:11px 14px calc(11px + var(--safe-b));display:flex;align-items:center;gap:10px;
  transform:translateY(130%);transition:transform .24s;box-shadow:0 -6px 22px rgba(0,0,0,.22);
}
#cmpbar.on{transform:none}
#cmpbar .thumbs{display:flex;gap:6px;flex:1;overflow:hidden}
#cmpbar .thumbs div{width:40px;height:34px;background:#fff;border-radius:8px;padding:2px;flex:0 0 auto}
#cmpbar .thumbs img{width:100%;height:100%;object-fit:contain}
#cmpbar .go{background:var(--verde);padding:11px 18px;border-radius:11px;font-weight:700;font-size:13.5px}
#cmpbar .clr{font-size:12px;color:#B6A3CC;padding:6px}
#cmpview{position:fixed;inset:0;z-index:70;background:var(--fondo);overflow:auto;display:none}
#cmpview.on{display:block}
.cmptable{width:100%;border-collapse:collapse;background:#fff;font-size:12.5px}
.cmptable th,.cmptable td{padding:10px 9px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:top}
.cmptable thead th{position:sticky;top:56px;background:#fff;z-index:2;border-bottom:2px solid var(--morado)}
.cmptable thead img{height:56px;object-fit:contain;margin:0 auto 6px}
.cmptable thead .nm{font-size:12.5px;font-weight:800;line-height:1.2}
.cmptable thead .pz{font-size:12px;color:var(--morado);font-weight:800;margin-top:3px}
.cmptable td:first-child,.cmptable th:first-child{color:var(--gris);font-weight:600;width:26%;background:#FAF9FC;position:sticky;left:0}
.cmptable tr.dif td:not(:first-child){background:#F1FBF2}

@media print{
  header,#cmpbar,.dtop,.dacts,#cover{display:none!important}
  #detail{position:static;transform:none;overflow:visible}
  body{background:#fff}
  .hl div,table.sp,.dprice{box-shadow:none;border:1px solid #ddd}
}
</style>
</head>

const IMG = {"tank180": "img/tank180.jpg", "ky5": "img/ky5.jpg", "t2150": "img/t2150.jpg", "q2s": "img/q2s.jpg", "q2c": "img/q2c.jpg", "q3s": "img/q3s.jpg", "q3c": "img/q3c.jpg", "q4dr": "img/q4dr.jpg", "kp1": "img/kp1.jpg", "j3atr": "img/j3atr.jpg", "j3a": "img/j3a.jpg", "tp6": "img/tp6.jpg", "e1500": "img/e1500.jpg", "a6": "img/a6.jpg", "a7cs": "img/a7cs.jpg", "a7pluss": "img/a7pluss.jpg", "a7dr": "img/a7dr.jpg", "a7drp": "img/a7drp.jpg", "a7drh": "img/a7drh.jpg", "g300dr": "img/g300dr.jpg", "g300drh": "img/g300drh.jpg", "g300s": "img/g300s.jpg", "stronger": "img/stronger.jpg", "trapper150": "img/trapper150.jpg", "jin150": "img/jin150.jpg", "matt150": "img/matt150.jpg", "matt250": "img/matt250.jpg", "tigercat300": "img/tigercat300.jpg", "raven300": "img/raven300.jpg", "mt125": "img/mt125.jpg", "m12": "img/m12.jpg", "acorazada150": "img/acorazada150.jpg", "blackwasp250": "img/blackwasp250.jpg", "krathos250": "img/krathos250.jpg", "warrior200": "img/warrior200.jpg", "titan300": "img/titan300.jpg", "scala50": "img/scala50.jpg", "colibri": "img/colibri.jpg", "colibri_plus": "img/colibri_plus.jpg", "a8": "img/a8.jpg", "b1": "img/b1.jpg", "b1_pro": "img/b1_pro.jpg", "estrella": "img/estrella.jpg", "king_kong": "img/king_kong.jpg", "maya": "img/maya.jpg", "e3_plus": "img/e3_plus.jpg", "lobo_plus": "img/lobo_plus.jpg", "lobo_drive": "img/lobo_drive.jpg", "quetzal_volt": "img/quetzal_volt.jpg", "pegasus": "img/pegasus.jpg", "triton": "img/triton.jpg", "lince": "img/lince.jpg", "ocelote": "img/ocelote.jpg", "jaguar": "img/jaguar.jpg", "lince_plus": "img/lince_plus.jpg", "jaguar_plus": "img/jaguar_plus.jpg", "tenochtitlan": "img/tenochtitlan.jpg", "teotihuacan": "img/teotihuacan.jpg"};;
const TEL = "525566257180";
let fMarca="todas", fCat="todas", cmp=[];

const money = v => "$" + v.toLocaleString("es-MX");

function entrar(){ document.getElementById("cover").classList.add("off"); }
function toggleSearch(){
  const s=document.getElementById("sw"); s.classList.toggle("on");
  if(s.classList.contains("on")) document.getElementById("q").focus();
  else { document.getElementById("q").value=""; render(); }
}
function resetAll(){ fMarca="todas"; fCat="todas"; document.getElementById("q").value=""; buildChips(); render(); window.scrollTo(0,0); }

function buildChips(){
  const cm=document.getElementById("chipsMarca");
  cm.innerHTML = `<button class="chip ${fMarca==='todas'?'on':''}" onclick="setMarca('todas')">Todas las marcas</button>` +
    DB.marcas.map(m=>`<button class="chip ${fMarca===m.n?'on':''}" onclick="setMarca('${m.n}')">${m.n}</button>`).join("");
  const cats=[...new Set(DB.items.filter(i=>fMarca==="todas"||i.m===fMarca).map(i=>i.c))]
    .sort((a,b)=>{const x=DB.ordenCat.indexOf(a),y=DB.ordenCat.indexOf(b);
                  return (x<0?99:x)-(y<0?99:y)||a.localeCompare(b,"es");});
  const cc=document.getElementById("chipsCat");
  cc.innerHTML = `<button class="chip ${fCat==='todas'?'on':''}" onclick="setCat('todas')">Todos los tipos</button>` +
    cats.map(c=>`<button class="chip ${fCat===c?'on':''}" onclick="setCat('${c}')">${c}</button>`).join("");
}
function setMarca(m){
  fMarca=m; fCat="todas"; buildChips(); render();
  const on=document.querySelector("#chipsMarca .chip.on");
  if(on) on.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  window.scrollTo({top:0,behavior:"smooth"});
}
function setCat(c){ fCat=c; buildChips(); render(); }

function filtrar(){
  const q=(document.getElementById("q").value||"").toLowerCase().trim();
  let r=DB.items.filter(i=>(fMarca==="todas"||i.m===fMarca)&&(fCat==="todas"||i.c===fCat));
  if(q) r=r.filter(i=>(i.n+" "+i.m+" "+i.c+" "+i.s.map(x=>x.join(" ")).join(" ")+" "+i.d.map(x=>x.join(" ")).join(" ")).toLowerCase().includes(q));
  const o=document.getElementById("orden").value;
  if(o==="asc") r.sort((a,b)=>(a.p??1e9)-(b.p??1e9));
  if(o==="desc") r.sort((a,b)=>(b.p??-1)-(a.p??-1));
  if(o==="az") r.sort((a,b)=>a.n.localeCompare(b.n,"es"));
  r.sort((a,b)=>a.pend-b.pend);   // las fichas en proceso siempre al final
  return r;
}

const PH = `<svg viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="32" r="9"/><circle cx="50" cy="32" r="9"/><path d="M23 32h18l-6-16h-8"/><path d="M35 16l6-6h6"/><path d="M14 32l7-14h6"/></svg>`;

function render(){
  const r=filtrar();
  const np=r.filter(i=>i.pend).length;
  document.getElementById("count").innerHTML =
    `<b>${r.length-np}</b> ${r.length-np===1?"modelo":"modelos"}` + (np?` · <span style="color:#8A6212">${np} por integrar</span>`:"");
  const g=document.getElementById("grid");
  if(!r.length){ g.innerHTML=`<div class="empty" style="grid-column:1/-1">Sin resultados. Prueba con otra marca o palabra.</div>`; return; }
  g.innerHTML=r.map(i=>`
    <div class="card ${i.pend?'pend':''}" onclick="openDetail('${i.id}')">
      ${i.pend?'':`<button class="cmpbtn ${cmp.includes(i.id)?'on':''}" onclick="event.stopPropagation();toggleCmp('${i.id}')" title="Comparar">${cmp.includes(i.id)?'&#10003;':'&#43;'}</button>`}
      <div class="ph">${i.pend?PH:`<img loading="lazy" src="${IMG[i.img]}" alt="${i.n}">`}</div>
      <div class="body">
        ${i.pend?'<span class="tagpend">Ficha en proceso</span>':''}
        <div class="mk">${i.m}</div>
        <h3>${i.n}</h3>
        <div class="cat">${i.c}</div>
        <div class="pr ${i.p?'':'ask'}">${i.p?money(i.p)+' <small>MXN</small>':'Precio a consultar'}</div>
      </div>
    </div>`).join("");
}

function openDetail(id){
  const i=DB.items.find(x=>x.id===id);
  const msg=encodeURIComponent(i.pend
    ? `Hola CELOMI Motors, me interesa la ${i.n} (${i.m}). ¿Me pueden enviar fotos y ficha técnica?`
    : `Hola CELOMI Motors, me interesa la ${i.n} (${i.m}). ¿Me pueden dar más información?`);
  document.getElementById("detail").innerHTML=`
    <div class="dtop">
      <button class="back" onclick="closeDetail()">&#8592;</button>
      <div class="t">${i.n}</div>
      ${i.pend?'':`<button class="cmpbtn" style="position:static;background:${cmp.includes(i.id)?'#1E8A2D':'#F4F2F7'};color:${cmp.includes(i.id)?'#fff':'#6B6875'}" onclick="toggleCmp('${i.id}');openDetail('${i.id}')">${cmp.includes(i.id)?'&#10003;':'&#43;'}</button>`}
    </div>
    <div class="dgrid">
      <div class="hero">${i.pend?`<div style="color:#B7AEC7;padding:36px 0">${PH}</div>`:`<img src="${IMG[i.img]}" alt="${i.n}">`}</div>
      <div class="dwrap">
        ${i.pend?'<span class="tagpend" style="margin-top:16px">Ficha en proceso</span>':''}
        <div class="dmk">${i.m}</div>
        <h2>${i.n}</h2>
        <div class="dcat">${i.c}</div>
        <div class="dprice ${i.p?'':'ask'}">
          <div><div class="l">Precio público</div><div class="n">${i.p?money(i.p)+'<u>MXN</u>':'A consultar'}</div></div>
          ${i.p?'<div class="msi">Financiamiento disponible<br>Galgo · Maxikash · Atrato · Kepi</div>':''}
        </div>
        ${i.pend?`
        <div class="pendbox">${PH}<b>Ficha técnica en proceso</b>
          Este modelo ya tiene precio vigente y se puede cotizar.<br>
          Estamos integrando fotografías y especificaciones del proveedor.</div>`:`
        <div class="hl">${i.d.map(d=>`<div><b>${d[0]}</b><span>${d[1]}</span></div>`).join("")}</div>
        ${i.col && i.col.length?`<div class="sec">Colores disponibles</div><div class="cols">${i.col.map(c=>`<i style="background:${c}"></i>`).join("")}</div>`:""}
        <div class="sec">Ficha técnica</div>
        <table class="sp">${i.s.map(s=>`<tr><td>${s[0]}</td><td>${s[1]}</td></tr>`).join("")}</table>`}
        ${i.nota?`<div class="nota">⚠ ${i.nota}</div>`:""}
        <div class="dacts">
          <a class="btn pri" target="_blank" rel="noopener" href="https://wa.me/${TEL}?text=${msg}">${i.pend?'Solicitar información':'Cotizar por WhatsApp'}</a>
          <button class="btn sec" onclick="window.print()">Imprimir ficha</button>
          <a class="btn sec" href="tel:+525566257180">Llamar</a>
        </div>
      </div>
    </div>`;
  document.getElementById("detail").classList.add("on");
  document.getElementById("detail").scrollTop=0;
  document.body.style.overflow="hidden";
  history.pushState({d:1},"");
}
function closeDetail(){
  document.getElementById("detail").classList.remove("on");
  document.body.style.overflow="";
  render();
}

function toggleCmp(id){
  const k=cmp.indexOf(id);
  if(k>=0) cmp.splice(k,1);
  else { if(cmp.length>=3){ alert("Puedes comparar hasta 3 unidades."); return; } cmp.push(id); }
  drawCmpBar(); render();
}
function clearCmp(){ cmp=[]; drawCmpBar(); render(); }
function drawCmpBar(){
  const b=document.getElementById("cmpbar");
  b.classList.toggle("on",cmp.length>0);
  document.getElementById("cmpThumbs").innerHTML=cmp.map(id=>{
    const i=DB.items.find(x=>x.id===id);
    return `<div><img src="${IMG[i.img]}" alt="${i.n}"></div>`;
  }).join("");
}
function openCmp(){
  if(cmp.length<2){ alert("Selecciona al menos 2 unidades para comparar."); return; }
  const its=cmp.map(id=>DB.items.find(x=>x.id===id));
  const keys=[]; its.forEach(i=>i.s.forEach(s=>{ if(!keys.includes(s[0])) keys.push(s[0]); }));
  keys.sort((a,b)=>{const x=DB.ordenSpec.indexOf(a),y=DB.ordenSpec.indexOf(b);
                    return (x<0?99:x)-(y<0?99:y);});
  const val=(i,k)=>{ const f=i.s.find(s=>s[0]===k); return f?f[1]:"—"; };
  document.getElementById("cmpview").innerHTML=`
    <div class="dtop" style="position:sticky;top:0">
      <button class="back" onclick="closeCmp()">&#8592;</button>
      <div class="t">Comparativa (${its.length})</div>
      <button class="back" onclick="window.print()">&#128424;</button>
    </div>
    <table class="cmptable">
      <thead><tr><th></th>${its.map(i=>`<th><img src="${IMG[i.img]}"><div class="nm">${i.n}</div><div class="pz">${i.p?money(i.p):'A consultar'}</div></th>`).join("")}</tr></thead>
      <tbody>
        <tr><td>Marca</td>${its.map(i=>`<td>${i.m}</td>`).join("")}</tr>
        <tr><td>Tipo</td>${its.map(i=>`<td>${i.c}</td>`).join("")}</tr>
        ${keys.map(k=>{
          const vs=its.map(i=>val(i,k));
          const dif=new Set(vs).size>1;
          return `<tr class="${dif?'dif':''}"><td>${k}</td>${vs.map(v=>`<td>${v}</td>`).join("")}</tr>`;
        }).join("")}
      </tbody>
    </table>
    <div style="padding:18px 16px 40px"><a class="btn pri" style="text-decoration:none" target="_blank" rel="noopener"
      href="https://wa.me/${TEL}?text=${encodeURIComponent('Hola CELOMI Motors, quisiera cotizar: '+its.map(i=>i.n).join(', ')+'.')}">Cotizar estas ${its.length} unidades</a></div>`;
  document.getElementById("cmpview").classList.add("on");
  document.body.style.overflow="hidden";
  history.pushState({c:1},"");
}
function closeCmp(){ document.getElementById("cmpview").classList.remove("on"); document.body.style.overflow=""; }

window.addEventListener("popstate",()=>{
  if(document.getElementById("cmpview").classList.contains("on")) closeCmp();
  else if(document.getElementById("detail").classList.contains("on")) closeDetail();
});

buildChips(); render(); drawCmpBar();
</script>
</body>
</html>
